# The collector's settings: what comes in, what it removes, where it goes.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  prometheus:
    config:
      scrape_configs:
        - job_name: kubelet
          scheme: https
          scrape_interval: 60s
          kubernetes_sd_configs: [{role: node}]
          authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
          tls_config: {insecure_skip_verify: true}
          metrics_path: /metrics/cadvisor
          relabel_configs:
            - {source_labels: [__meta_kubernetes_node_label_platform_tier], target_label: tier}
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: machine_memory_bytes|machine_cpu_cores|container_(memory_working_set_bytes|cpu_usage_seconds_total|spec_memory_limit_bytes|fs_usage_bytes|fs_limit_bytes)
              action: keep
            - {source_labels: [id, container], regex: "/.+;", action: drop}
            - {regex: id|image|name, action: labeldrop}

processors:
  memory_limiter: {limit_mib: 110, check_interval: 2s}
  attributes/remove_private:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: http.request.header.cookie, action: delete}
      - {key: url.query, action: delete}
      - {key: url.full, action: delete}
      - {key: http.url, action: delete}
      - {key: http.target, action: delete}
      - {key: url.path, action: delete}
      - {key: client.address, action: delete}
      - {key: net.peer.ip, action: delete}
  filter/unused:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(name, "^traefik[._]") and not IsMatch(name, "tls[._]certs[._]not[._]after")'
        - 'name == "http.client.request.duration" and resource.attributes["service.name"] == "traefik"'
        - 'IsMatch(name, "^http[.]server[.](request|response)[.]body[.]size$")'
  batch: {timeout: 10s}

exporters:
  otlp_http:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers: {Authorization: "Basic ${env:GRAFANA_AUTH}"}

extensions:
  health_check: {endpoint: 0.0.0.0:13133}

service:
  extensions: [health_check]
  telemetry: {logs: {level: warn}}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, attributes/remove_private, batch], exporters: [otlp_http]}
    metrics: {receivers: [otlp, prometheus], processors: [memory_limiter, filter/unused, attributes/remove_private, batch], exporters: [otlp_http]}
    logs: {receivers: [otlp], processors: [memory_limiter, attributes/remove_private, batch], exporters: [otlp_http]}
