# Gitleaks settings: the default rules, minus four known test values and a public checksum.
[extend]
useDefault = true

[allowlist]
description = "Test values and public checksums"
regexTarget = "line"
regexes = ['''"idempotency_key":''', '''"key_ciphertext":''', '''AGE_KEYGEN_SHA256 :=''', '''key=?"?plainkey''']
