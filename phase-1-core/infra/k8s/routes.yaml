# Public HTTPS routes on associator.space.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kube-system
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    customResponseHeaders:
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: app
spec:
  stripPrefix:
    prefixes: ["/api"]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: app
spec:
  redirectRegex:
    regex: "^https://www\\.__DOMAIN__/(.*)"
    replacement: "https://__DOMAIN__/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-pages
  namespace: app
spec:
  rateLimit:
    average: 20
    period: 1s
    burst: 100
    sourceCriterion: {ipStrategy: {depth: 0}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-api
  namespace: app
spec:
  rateLimit:
    average: 10
    period: 1s
    burst: 40
    sourceCriterion: {ipStrategy: {depth: 0}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limit-in-flight
  namespace: app
spec:
  inFlightReq:
    amount: 20
    sourceCriterion: {ipStrategy: {depth: 0}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: site
  namespace: app
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`__DOMAIN__`) && PathPrefix(`/api/`) && !Path(`/api/readyz`)
      kind: Rule
      middlewares: [{name: limit-in-flight}, {name: limit-api}, {name: strip-api}]
      services: [{name: api, port: 8000}]
    - match: Host(`__DOMAIN__`) && Path(`/mcp`)
      kind: Rule
      middlewares: [{name: limit-in-flight}, {name: limit-api}]
      services: [{name: mcp-server, port: 8001}]
    - match: Host(`__DOMAIN__`)
      kind: Rule
      middlewares: [{name: limit-in-flight}, {name: limit-pages}]
      services: [{name: web, port: 3000}]
    - match: Host(`www.__DOMAIN__`)
      kind: Rule
      middlewares: [{name: www-to-apex}]
      services: [{name: web, port: 3000}]
  tls:
    certResolver: letsencrypt
    domains:
      - main: __DOMAIN__
        sans: [www.__DOMAIN__]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-traefik-only
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
    - from:
        - podSelector: {}
    - from:
        - ipBlock: {cidr: 10.20.0.0/16}
