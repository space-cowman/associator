# The safety package.
[project]
name = "platform-v2-safety"
version = "0.1.0"
description = "platform-v2 safety service: deterministic checks on posts, replies and drafts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "detect-secrets==1.5.0",
    "presidio-analyzer>=2.2.365",
    "spacy>=3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "safety"
