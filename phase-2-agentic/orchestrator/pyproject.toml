# The orchestrator package.
[project]
name = "platform-v2-orchestrator"
version = "0.1.0"
description = "platform-v2 orchestrator: Ask my AI as a LangGraph flow across the person's own models"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]>=3.2",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orchestrator"
